services:
  mysql:
    image: mysql:8.0
    container_name: Cartlify
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Cartlify_root
      MYSQL_DATABASE: Cartlify_db
      MYSQL_USER: Cartlify_user
      MYSQL_PASSWORD: Cartlify_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - Cartlify_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: Cartlify_php
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: Cartlify_user
      PMA_PASSWORD: Cartlify_password
    ports:
      - "8083:80"
    depends_on:
      - mysql
    networks:
      - Cartlify_network

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      #SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
  mysql_data:

networks:
  Cartlify_network:
    driver: bridge
