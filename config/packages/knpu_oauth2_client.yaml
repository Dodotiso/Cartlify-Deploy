knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            redirect_route: google_auth_callback
            redirect_params: {}
            # Optional: restrict to specific domain (staff only)
            # hosted_domain: 'Cartlify'  # CHANGE THIS to your staff email domain